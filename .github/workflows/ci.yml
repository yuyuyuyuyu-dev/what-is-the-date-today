name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ktlint:
    name: Check Kotlin Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Check Kotlin Formatting (ktlint)
        run: ./gradlew ktlintCheck

  prettier:
    name: Check Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Formatting (Prettier)
        run: npm run format:check

  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run Linter (detekt)
        run: ./gradlew detekt

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Run Tests
        run: ./gradlew wasmJsTest

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "jetbrains"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      # Mirror the deploy build so a broken production build is caught in CI,
      # before it is merged to main, instead of failing at deploy time.
      - name: Export Library Definitions
        run: ./gradlew :composeApp:exportLibraryDefinitions -PaboutLibraries.exportPath=src/commonMain/composeResources/files/

      - name: Build
        run: ./gradlew :composeApp:wasmJsBrowserDistribution
