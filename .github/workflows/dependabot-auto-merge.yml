name: Dependabot Auto-merge

on:
  pull_request:
    branches: ["main"]

jobs:
  auto-merge:
    name: Auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # A GitHub App token is used instead of GITHUB_TOKEN because a merge made
      # with GITHUB_TOKEN does not trigger the CI workflow, which the deploy
      # workflow waits for. Its secrets are read from the Dependabot secrets,
      # not the Actions ones, because this workflow runs on Dependabot events.
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
